# Profil dev: H2 w pamięci, w trybie zgodności z MySQL, żeby SQL i zachowanie
# były jak najbliższe produkcji. DB_CLOSE_DELAY=-1 trzyma bazę, dopóki działa aplikacja.
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:appdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
db.username=sa
db.password=
db.pool-size=5
# Przy starcie tworzy tabele i wrzuca przykładowe dane
db.init=true
# JPA/Hibernate: sprawdzaj zgodność encji z tabelami, pokazuj SQL w logach
jpa.ddl-auto=validate
jpa.show-sql=true
