# Profil prod: MySQL. Wartości bierzemy ze zmiennych środowiskowych,
# po dwukropku jest wartość domyślna. Hasła nie trzymamy w repozytorium.
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://127.0.0.1:3306/my_db
db.username=sa-database
db.password=unused
db.pool-size=${DB_POOL_SIZE:10}
# Na produkcji schemat zakładamy migracjami (np. Flyway), nie przy starcie
db.init=false
# JPA/Hibernate: tylko walidacja schematu, bez logowania SQL
jpa.ddl-auto=validate
jpa.show-sql=true
